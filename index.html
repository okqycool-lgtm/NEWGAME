<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120a26">
<title>Cyber Heist — Glass District</title>
<style>
  :root {
    --cash: #35ff6b; --cyan: #39f0ff; --pink: #ff3df0; --accent: #ffd60a; --verm: #ff4a1c; --ink: #0d0820;
    --font: "Arial Black", "Segoe UI Black", Impact, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0a0618; overflow: hidden; overscroll-behavior: none; }
  body { font-family: var(--font); color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
  #app { position: fixed; inset: 0; }
  canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- HUD ---------- */
  #hud { position: absolute; inset: 0; pointer-events: none;
    padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left)); }
  .chip { position: absolute; top: max(10px, env(safe-area-inset-top)); background: rgba(13, 8, 32, .72); border: 2px solid rgba(255,255,255,.14);
    padding: 6px 14px 7px; transform: skewX(-9deg); line-height: 1; }
  .chip > * { display: block; transform: skewX(9deg); }
  .chip .lbl { font-size: 10px; letter-spacing: .22em; opacity: .7; margin-bottom: 3px; }
  #cashbox { left: max(12px, env(safe-area-inset-left)); border-color: var(--cash); box-shadow: 0 0 18px rgba(53,255,107,.25); }
  #cash { font-size: clamp(22px, 5.4vw, 34px); color: var(--cash); font-variant-numeric: tabular-nums; text-shadow: 0 0 12px rgba(53,255,107,.6); }
  #cashbox.hit { animation: shake .35s; border-color: #ff3b30; }
  #cashbox.gain { animation: pop .35s; }
  #delta { position: absolute; left: 8px; top: 100%; margin-top: 6px; font-size: 18px; white-space: nowrap; opacity: 0; }
  #delta.show { animation: rise 1.5s ease-out forwards; }
  #delta.loss { color: #ff5247; } #delta.gain { color: var(--cash); }
  #timebox { right: max(64px, calc(env(safe-area-inset-right) + 64px)); border-color: var(--cyan); text-align: right; }
  #time { font-size: clamp(18px, 4.4vw, 26px); color: var(--cyan); font-variant-numeric: tabular-nums; }
  #mute { position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); width: 42px; height: 42px;
    pointer-events: auto; background: rgba(13,8,32,.72); color: #fff; border: 2px solid rgba(255,255,255,.25); font: 18px var(--font); cursor: pointer; }
  #mute.off { opacity: .45; text-decoration: line-through; }
  #progress { position: absolute; left: 0; right: 0; top: 0; height: 4px; background: rgba(255,255,255,.08); }
  #progfill { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--pink), var(--cyan)); }
  #prompt { position: absolute; left: 50%; top: 21%; transform: translateX(-50%) skewX(-9deg); max-width: min(92vw, 620px); text-align: center;
    background: rgba(13,8,32,.8); border: 2px solid var(--accent); color: #fff; padding: 9px 18px; font-size: clamp(13px, 3.4vw, 19px);
    letter-spacing: .04em; opacity: 0; transition: opacity .18s; text-transform: uppercase; line-height: 1.25; }
  #prompt.show { opacity: 1; }
  #prompt b { color: var(--accent); }
  #toast { position: absolute; left: 50%; top: 36%; transform: translateX(-50%); text-align: center; font-size: clamp(16px, 4.6vw, 28px);
    letter-spacing: .05em; text-shadow: 0 2px 0 #000, 0 0 18px currentColor; opacity: 0; white-space: nowrap; font-style: italic; }
  #toast.show { animation: toast 1.6s ease-out forwards; }
  #toast.loss { color: #ff5247; } #toast.gain { color: var(--cash); } #toast.trick { color: var(--accent); font-size: clamp(14px, 3.6vw, 22px); top: 44%; }
  #flash { position: absolute; inset: 0; background: #ff2030; opacity: 0; pointer-events: none; transition: opacity .5s; }
  #flash.on { opacity: .55; transition: none; }

  /* ---------- touch controls ---------- */
  #touch { position: absolute; inset: 0; pointer-events: none; display: none; }
  #touch.on { display: block; }
  #steer { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom));
    width: min(46vw, 300px); height: 104px; pointer-events: auto; touch-action: none; border-radius: 52px;
    background: rgba(13,8,32,.45); border: 2px solid rgba(57,240,255,.55); display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; font-size: 26px; color: var(--cyan); }
  #steer.down { background: rgba(57,240,255,.16); }
  #knob { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
    background: rgba(57,240,255,.35); border: 2px solid var(--cyan); pointer-events: none; }
  .tbtn { position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; font: 15px var(--font); letter-spacing: .06em; color: #fff; }
  #btn-jump { right: max(14px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); width: 108px; height: 108px;
    background: rgba(255,214,10,.22); border: 3px solid var(--accent); }
  #btn-slide { right: calc(max(14px, env(safe-area-inset-right)) + 118px); bottom: max(18px, env(safe-area-inset-bottom)); width: 84px; height: 84px;
    background: rgba(255,61,240,.2); border: 3px solid var(--pink); font-size: 13px; }
  .tbtn.down { filter: brightness(1.8); transform: scale(.94); }

  /* ---------- overlays ---------- */
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 20px; background: linear-gradient(180deg, rgba(10,6,24,.72), rgba(10,6,24,.2) 45%, rgba(10,6,24,.78)); }
  .overlay.hidden { display: none; }
  .logo { font-size: clamp(44px, 13vw, 118px); line-height: .86; font-style: italic; letter-spacing: -.02em; margin: 0;
    color: #fff; text-shadow: 3px 3px 0 var(--pink), -3px -3px 0 var(--cyan); }
  .logo span { color: var(--accent); text-shadow: 3px 3px 0 var(--verm); }
  .sub { margin: 14px 0 0; font-size: clamp(12px, 3vw, 17px); letter-spacing: .34em; color: var(--cyan); }
  .go { margin-top: 30px; font-size: clamp(15px, 4vw, 22px); background: var(--accent); color: var(--ink); padding: 12px 24px; transform: skewX(-9deg);
    animation: pulse 1.1s infinite; border: 0; font-family: var(--font); cursor: pointer; pointer-events: auto; }
  .keys { margin-top: 22px; display: grid; grid-template-columns: auto auto; gap: 5px 14px; font: 600 clamp(11px, 2.8vw, 14px) "Segoe UI", system-ui, sans-serif;
    text-align: left; color: #d9d2ff; }
  .keys b { color: #fff; text-align: right; font-family: var(--font); }
  .bests { margin-top: 18px; font: 600 13px "Segoe UI", system-ui, sans-serif; color: #b9b0e6; min-height: 1.2em; }
  #results { background: rgba(10,6,24,.84); }
  #results h2 { font-size: clamp(30px, 8.5vw, 64px); margin: 0 0 4px; font-style: italic; color: var(--accent); text-shadow: 3px 3px 0 var(--verm); }
  #results .tag { letter-spacing: .3em; font-size: 12px; color: var(--cyan); margin-bottom: 20px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(92vw, 460px); }
  .stat { background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.16); padding: 10px 8px; position: relative; }
  .stat .lbl { font-size: 10px; letter-spacing: .2em; opacity: .7; display: block; margin-bottom: 4px; }
  .stat .val { font-size: clamp(20px, 5.6vw, 30px); font-variant-numeric: tabular-nums; }
  .stat.cash .val { color: var(--cash); } .stat.time .val { color: var(--cyan); }
  .stat.best { border-style: dashed; } .stat.best .val { font-size: clamp(16px, 4.4vw, 22px); }
  .stat.new::after { content: "NEW BEST"; position: absolute; top: -9px; right: -6px; background: var(--pink); color: #fff; font-size: 10px; padding: 2px 6px; transform: rotate(4deg); }
  #retry { margin-top: 22px; }
  .hint { margin-top: 10px; font: 600 12px "Segoe UI", system-ui, sans-serif; color: #b9b0e6; }

  @keyframes pulse { 50% { filter: brightness(1.25); transform: skewX(-9deg) scale(1.04); } }
  @keyframes shake { 20% { transform: skewX(-9deg) translateX(-7px); } 50% { transform: skewX(-9deg) translateX(6px); } 80% { transform: skewX(-9deg) translateX(-3px); } }
  @keyframes pop { 40% { transform: skewX(-9deg) scale(1.14); } }
  @keyframes rise { 0% { opacity: 0; transform: translateY(-6px); } 12% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(14px); } }
  @keyframes toast { 0% { opacity: 0; transform: translateX(-50%) scale(1.5); } 12% { opacity: 1; transform: translateX(-50%) scale(1); } 72% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) translateY(-16px); } }
  @media (max-width: 480px) { #steer { width: 40vw; height: 92px; padding: 0 12px; } #knob { width: 56px; height: 56px; margin: -28px 0 0 -28px; }
    #btn-jump { width: 96px; height: 96px; } #btn-slide { width: 76px; height: 76px; right: calc(max(14px, env(safe-area-inset-right)) + 104px); } }
  @media (max-height: 430px) { .keys, .bests { display: none; } .go { margin-top: 14px; } #steer { height: 84px; } #btn-jump { width: 92px; height: 92px; } #btn-slide { width: 72px; height: 72px; right: calc(max(14px, env(safe-area-inset-right)) + 100px); } }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="hud">
    <div id="progress"><i id="progfill"></i></div>
    <div id="cashbox" class="chip"><span class="lbl">CASH</span><span id="cash">$50,000</span><span id="delta"></span></div>
    <div id="timebox" class="chip"><span class="lbl">TIME</span><span id="time">0:00.0</span></div>
    <button id="mute" aria-label="Toggle sound">♪</button>
    <div id="prompt"></div>
    <div id="toast"></div>
  </div>

  <div id="touch">
    <div id="steer"><span>◀</span><i id="knob"></i><span>▶</span></div>
    <button id="btn-slide" class="tbtn">SLIDE</button>
    <button id="btn-jump" class="tbtn">JUMP</button>
  </div>

  <div id="title" class="overlay">
    <h1 class="logo">CYBER<br><span>HEIST</span></h1>
    <p class="sub">GLASS DISTRICT</p>
    <button class="go" id="start">TAP / SPACE — KICK THROUGH THE GLASS</button>
    <div class="keys">
      <b>A D / ← →</b><span>steer (touch: left pad)</span>
      <b>SPACE</b><span>jump · double jump · vault · wall kick</span>
      <b>S / ↓</b><span>slide · roll on long drops</span>
    </div>
    <div class="bests" id="title-bests"></div>
  </div>

  <div id="results" class="overlay hidden">
    <h2 id="res-head">CLEAN GETAWAY</h2>
    <div class="tag">GLASS DISTRICT</div>
    <div class="stats">
      <div class="stat cash" id="st-cash"><span class="lbl">CASH DELIVERED</span><span class="val" id="res-cash">$0</span></div>
      <div class="stat time" id="st-time"><span class="lbl">TIME</span><span class="val" id="res-time">0:00.0</span></div>
      <div class="stat best cash"><span class="lbl">BEST CASH</span><span class="val" id="res-bestcash">—</span></div>
      <div class="stat best time"><span class="lbl">BEST TIME</span><span class="val" id="res-besttime">—</span></div>
    </div>
    <button class="go" id="retry">RETRY ↻</button>
    <div class="hint">Space / Enter / R</div>
  </div>

  <div id="flash"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
